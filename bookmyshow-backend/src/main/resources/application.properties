spring.application.name=BookMyShow

# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bookmyshow_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Optional config import for .env files
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Server Port
server.port=${PORT:8080}

# ===============================
# APP BUSINESS CONFIGURATION
# ===============================
# Seat lock expiration duration in minutes
app.booking.seat-lock-duration-minutes=5

# Payment simulation / integration mode (MOCK / RAZORPAY)
app.payment.provider=${PAYMENT_PROVIDER:MOCK}
app.payment.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
app.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:secret_placeholder}

# Security / JWT
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ===============================
# LOGGING
# ===============================
logging.level.org.hibernate.SQL=WARN
logging.level.com.project.bookmyshow=INFO